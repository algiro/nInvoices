<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nInvoices</title>
    <script>
      // Apply the saved theme before the page paints, so dark mode never flashes white.
      // Keep the storage keys and theme ids in sync with src/composables/useTheme.ts.
      (function () {
        var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
        var pref = get('ninvoices.theme');
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var themes = dark ? ['dark', 'aurora', 'volt', 'orchid', 'cinder'] : ['light', 'lagoon', 'iris', 'ember'];
        var chosen = get(dark ? 'ninvoices.theme.dark' : 'ninvoices.theme.light');
        document.documentElement.dataset.theme = themes.indexOf(chosen) >= 0 ? chosen : themes[0];
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
